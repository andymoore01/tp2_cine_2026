<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cine Aurora 📽️ - Login</title>
    <meta name="description" content="Cine Aurora - Login" />
    <link rel="icon" href="../assets/favicon/logo-cine.png" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <header>
      <div>
        <h1>Cine Aurora</h1>
        <img src="../assets/favicon/logo-cine.png" alt="logo-cine-aurora" />
      </div>

      <nav>
        <a href="../index.html">Inicio</a>
        <a href="./estrenos.html">Próximos estrenos</a>
        <a href="../index.html">Volver</a>
      </nav>
    </header>

    <main class="main-registro">
      <div class="contenedor">
        <h2>Acceso Clientes</h2>

        <form class="form-registro" action="perfil.html">
          <div class="campo">
            <label for="email">Email</label>
            <input type="email" id="email" required />
          </div>

          <div class="campo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" required />
          </div>

          <button type="submit" class="btn">Ingresar</button>
        </form>

        <div class="extra">
          <p>¿No eres miembro? <a href="registro.html">Regístrate</a></p>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>&copy; 2026 Cine Aurora - Todos los derechos reservados</p>
    </footer>
  </body>
</html>
